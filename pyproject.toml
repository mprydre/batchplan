[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mprydre-batchplan"
version = "0.1.0"
description = "按并发、限流与重试约束排出批处理排程，并预估耗时与成本。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mprydre" }]
keywords = ["batching", "throughput", "rate-limit", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mprydre.github.io"
Repository = "https://github.com/mprydre/batchplan"
Issues = "https://github.com/mprydre/batchplan/issues"

[project.scripts]
batchplan = "batchplan:main"

[tool.setuptools]
py-modules = ["batchplan"]
